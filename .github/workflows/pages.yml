name: Deploy Hanyutong to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache pinned dictionary snapshots
        uses: actions/cache@v4
        with:
          path: |
            .dictionary-cache/*.gz
            .dictionary-cache/*.zip
          key: dictionary-bkrs-${{ hashFiles('dictionary-sources.json') }}

      - name: Build the full Russian dictionary
        run: |
          python3 scripts/fetch_dictionary.py
          python3 scripts/build_dictionary.py --bkrs .dictionary-cache/dabkrs_261105.gz --unihan .dictionary-cache/Unihan-17.0.0.zip --scratch .dictionary-cache/build.sqlite

      - name: Build teaching library and verified PDF reader
        run: |
          python3 scripts/build_library_catalog.py
          python3 scripts/fetch_pdfjs.py

      - name: Test dictionary and app
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
          node --check web/js/hsk3.js
          node --check web/js/wordwall.js
          node --check web/js/study.js
          node --check web/js/translate.js
          node --check web/js/ai-learning.js
          node --check web/js/ai-pronunciation.js
          node tools/ai-content.mjs evaluate --offline
          node --check web/js/ai.js
          node --check infra/yandex/function/translate.js
          node --check infra/yandex/function/translation-budget.js
          node --check infra/yandex/function/ai-assessment.js
          node --check infra/yandex/function/ai-feedback.js
          node --check infra/yandex/function/ai-chat.js
          node --check infra/yandex/function/ai-vision.js
          node --check infra/yandex/function/ai-speech.js
          node --check infra/yandex/function/ai-budget.js
          node --check web/js/app.js
          node --check web/js/dictionary.js
          node --check web/js/scenarios.js
          node --check web/js/library.js
          node --check infra/yandex/function/index.js

      - name: Check static app
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html .nojekyll manifest.webmanifest sw.js js/translate.js css/translate.css js/ai.js css/ai.css js/ai-learning.js js/ai-pronunciation.js css/ai-pronunciation.css js/app.js js/hsk3.js js/study.js js/wordwall.js css/study.css data/hsk3/legacy-bridge.json data/hsk3/manifest.json data/hsk3/exams.json js/content.js js/dictionary.js js/scenarios.js js/library.js data/library-catalog.json vendor/pdfjs/legacy/build/pdf.min.mjs vendor/pdfjs/legacy/build/pdf.worker.min.mjs vendor/fflate.min.js data/dictionary/manifest.json css/app.css; do test -s "web/$f" || test -f "web/$f"; done
          for n in 1 2 3 4 5 6; do python3 -c "import json,sys; d=json.load(open('web/data/hsk$n.json')); assert len(d)>100" ; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
